name: Update AI education data

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    name: Update and commit source data
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit the generated public data file.
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch latest sources
        run: python scripts/update_data.py
      - name: Validate generated content boundaries
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/test_url_security.mjs
      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/data/content.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/content.json
          git commit -m "Update AI education data"
          gh auth setup-git
          git push

  deploy:
    name: Deploy updated site
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required to check out the updated static site.
      pages: write     # Required to publish the prepared Pages artifact.
      id-token: write  # Required for GitHub Pages OIDC authentication.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out updated repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
